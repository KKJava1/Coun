server.port=8880

# 增加数据库连接
spring.datasource.url=jdbc:mysql://localhost:3307/coun?characterEncoding=UTF8&autoReconnect=true&serverTimezone=Asia/Shanghai&allowMultiQueries=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximumPoolSize=10
spring.datasource.hikari.max-lifetime: 30000

# 配置mybatis所有Mapper.xml所在的路径
mybatis.mapper-locations=classpath:/mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# 打印所有的sql日志：sql, 参数, 结果
logging.level.com.jiawa.wiki.mapper=trace

# redis配置
spring.redis.port=6379
spring.redis.host=localhost

netty.websocket.port=8086
netty.websocket.bossThreadNums=1
netty.websocket.workerThreadNums=2
netty.websocket.connectTimeout=15000
netty.websocket.backLog=123
netty.websocket.tcpNoDelay=true
netty.websocket.readerIdleTimeSeconds=30
netty.websocket.writerIdleTimeSeconds=30
netty.websocket.allIdleTimeSeconds=0
netty.websocket.maxContentLength=65536


